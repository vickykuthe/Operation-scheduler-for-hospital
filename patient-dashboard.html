<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Dashboard</title>
  <link rel="icon" href="images/patient.png" />
  <link rel="stylesheet" href="patient-dashboard.css" />
</head>
<body>
  <div class="dashboard-container">
    <h2>Patient Dashboard</h2>
    <p>Welcome! Below is your surgery schedule:</p>

    <table border="1">
      <thead>
        <tr>
          <th>Doctor Name</th>
          <th>Anesthesia</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="operationTable"></tbody>
      <button id="logoutBtn">Logout</button>
</table>      
  </div>
  <script type="module" src="patient-dashboard.js" defer></script>

</body>
</html>
